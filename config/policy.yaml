# --- OVERRIDES (friction, PAS verrou — cf red-team axiome 9) --------------
overrides:
  DISPLAY_BASE_RATE_AT_DECISION: {value: true, status: VALIDE, axiom: A7,
                                  note: "afficher n, taux de succès et coût cumulé des overrides passés AU MOMENT du choix"}
  BINDING_LOCKOUT:               {value: false, status: VALIDE, axiom: A7,
                                  note: "REFUSÉ : sur N faible le score est du bruit ; un verrou inciterait à ne plus logger"}
