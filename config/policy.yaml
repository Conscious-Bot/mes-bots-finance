# --- HIÉRARCHIE DE L'ÉVIDENCE (axiome 10 du gérant → poids A1) ------------
evidence_weight:
  L1_audited_filing_contract: 1.00   # 10-K/S-1, contrat, facture, données auditées
  L2_earnings_call:           0.75   # transcript, guidance officielle
  L3_management_claim:        0.50   # interview, blog corporate, claim non audité
  L4_sell_side_analyst:       0.35
  L5_social_press_secondary:  0.15   # X, presse secondaire, agrégateurs
  status: PROPOSE
  axiom: A1
  rules:
    - "N sources de même niveau répétant la même claim = 1 fait pondéré, jamais N (anti-écho)"
    - "date_du_fait ≠ date_de_publication : un fait hors fenêtre est dégradé"
    - "un urgent ne peut jamais reposer sur du L4/L5 seul"

