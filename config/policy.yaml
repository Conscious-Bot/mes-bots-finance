# PRESAGE — POLITIQUES (couche 3 de la CONSTITUTION)
# ---------------------------------------------------------------------------
# AXIOME 3 : aucune constante ne vit dans un document. Toute valeur numérique
# du système est ICI, nommée, datée, justifiée, avec sa condition de révision
# et l'axiome qu'elle instancie. Les docs référencent des NOMS, jamais des
# chiffres. Le code lit ce fichier, jamais des littéraux.
#
# Statut des valeurs : VALIDE (gérant) | PROPOSE (défaut en attente) | PLACEHOLDER
# (non calibré tant que la couche VIE est vide — cf CONSTITUTION §non-résolu 1).
# ---------------------------------------------------------------------------

meta:
  version: 1
  created: 2026-08-01
  owner: olivier
  revision_rule: >
    Révision annuelle (avec la revue NORTH_STAR) OU sur événement de vie.
    JAMAIS en drawdown (les règles ne se réécrivent pas sous le feu).
    Toute modification = nouvelle entrée datée, l'ancienne conservée en historique.

