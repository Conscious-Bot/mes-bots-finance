  CATALYST_URGENT_WINDOW_HOURS:    {value: 48, status: VALIDE, axiom: A5}
  ZERO_URGENT_IS_NORMAL:           {value: true, status: VALIDE, axiom: A1}
  TARGET_URGENT_TO_DECISION_RATE:  {value: 0.50, status: PROPOSE, axiom: A7, note: "sous ce seuil sur 4 semaines → resserrer les préconditions"}
