# open_questions.yaml — les interrogations VIVANTES du gérant (L17 déclaratif).
#
# Édité par OLIVIER uniquement, en français libre. Lu par le digest (SPEC
# enrichissement v2) : chaque signal enrichi est routé vers les questions qu'il
# informe → le digest cesse d'être un flux, il fait avancer des questions nommées.
# C'est le pont entre les débats de tête et le pipeline (fin du « je colle des
# threads X à Claude pour réfléchir »).
#
# Structure par entrée :
#   id        : Qn stable (ne pas renuméroter, les signaux historiques y référent)
#   question  : la problématique, falsifiable, en 1-2 phrases
#   marqueurs : les FAITS datés qui la font avancer (pas des humeurs) — ce que le
#               digest cherche dans les signaux pour la nourrir
#   lignes    : tickers du book concernés ("tout le book" si systémique)
#
# Ajoute/retire/reformule librement. Scaffoldé 29/07/2026 depuis les débats de la
# session (crash IA/semi) — à faire vivre.

