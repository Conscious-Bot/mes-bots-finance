  marqueurs:
    - "FCF hyperscaler vs capex (GOOGL déjà négatif -$5.9B)"
    - "croissance dette hors-bilan SPV/leases (Nikkei ~$1650B > dette officielle $1350B)"
    - "RÉVISIONS DE NOTATION ORACLE (le maillon fragile désigné)"
    - "taux d'utilisation RÉEL des datacenters déjà construits (la demande se matérialise ?)"
    - "craquements private credit : spreads, 1er défaut de neocloud (CoreWeave/Nebius)"
    - "yen carry trade (¥163, jauge du dé-levier qui amplifierait tout accident)"
