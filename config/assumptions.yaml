          date: 2026-08-01
          source: drill
          type: drill
          exercises: >
            (a) MODE REJOUÉ : « disque Mac mort, vault inaccessible » — restauration
            DEPUIS l'offsite VM sur dossier vierge.
            (b) NE COUVRE PAS : corruption silencieuse de l'archive, perte simultanée
            VM+Mac.
            (c) PRÉSUPPOSÉ DISPONIBLE ET QUE LA PANNE RETIRE : la clé ssh du Mac
            (~/.ssh/id_ed25519) a été utilisée pour tirer depuis la VM — or elle meurt
