            emprunté un chemin qui n'existe pas dans le scénario couvert. Fidélité
            réelle < 0,8 tant que H9c n'est pas prouvée. Un drill 1,0 se rejoue depuis
            une machine SANS la clé du Mac.
          claim: >
            DRILL HAUTE FIDÉLITÉ — scénario réel rejoué (Mac supposé mort) : cerveau
