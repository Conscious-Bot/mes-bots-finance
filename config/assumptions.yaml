# PRESAGE — GRAPHE D'HYPOTHÈSES EXÉCUTABLE (v3, 2026-08-01)
# ---------------------------------------------------------------------------
# v3 applique : A8 (aucune dérivée persistée) + A9 (reproductibilité).
#   - `observations: N` SUPPRIMÉ → `evidence: [objets]`. Le compte est DÉRIVÉ.
#     Effet immédiat et assumé : la conversion a exposé que plusieurs compteurs
#     de la v2 étaient des ordres de grandeur inventés, pas des observations
#     tracées. Ce qui n'est pas citable est désormais visible comme tel.
#   - `conduct` (prose) SUPPRIMÉ → registre `actions:` avec identifiants.
#     Le moteur propage des OBLIGATIONS, pas seulement des cassures (Flight Rules).
#   - poids d'étayage retirés du code → `policy.yaml: support_policy`.
#
# RELATIONS : requires (logique dure) | supports (appui probant) |
#             modulates (paramètre à recalculer) | correlated (aucune propagation)
# support.basis : empirical | theoretical | engineering | institutional | asserted
# ---------------------------------------------------------------------------

