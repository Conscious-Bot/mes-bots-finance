# ---------------------------------------------------------------------------
# ACTIONS — registre d'obligations (Flight Rules). Le moteur les PROPAGE.
# ---------------------------------------------------------------------------
actions:
  ACT-001: {do: "Redéfinir le ballast sur la nature du cash-flow (contracté), jamais sur une corrélation historique", blocking: false}
  ACT-002: {do: "Reclasser la ligne et vérifier la liquidité AVANT tout dimensionnement", blocking: false}
  ACT-003: {do: "Instruire la ligne sous 48h ; maintenir plafond par ligne pour que la fraude reste survivable", blocking: false}
  ACT-004: {do: "Réconcilier avec le broker ou basculer de source ; fail-closed maintenu", blocking: true}
  ACT-005: {do: "Contrôle automatique de cohérence des corporate actions vs broker", blocking: false}
  ACT-006: {do: "Rendre date_du_fait et evidence_origin obligatoires ; aucun urgent sur évidence secondaire seule", blocking: true}
  ACT-007: {do: "Implémenter evidence origin / path / independence dans le clustering", blocking: false}
  ACT-008: {do: "Implémenter la garde ROLE=replica (écriture refusée hors nœud)", blocking: true}
  ACT-009: {do: "Rétablir le backup offsite et TESTER une restauration complète (RTO 24h / RPO 1h)", blocking: true}
  ACT-010: {do: "GELER toute nouvelle politique scellée jusqu'à renseignement de la couche vie", blocking: true}
  ACT-011: {do: "Écrire le Continuity Plan (que faire du book en cas d'indisponibilité 6 mois)", blocking: false}
  ACT-012: {do: "Suppression nette au trimestre suivant : nommer ce qu'on retire avant tout ajout", blocking: false}
  ACT-013: {do: "Arbitrage écrit : accepter la concentration OU amender 'jamais de vente forcée'. GEL des politiques dépendant du cliquet", blocking: true}
  ACT-017: {do: "Drill 10 min : atteindre Hetzner/Storage Box depuis un appareil NON-Mac avec identifiants hors-machine (falsifier H9c)", blocking: false, deadline: "2026-10-30"}
  ACT-014: {do: "Interdire toute hausse de KELLY_FRACTION avant calibration mesurée", blocking: true}
  ACT-015: {do: "Instaurer la hiérarchie de triggers : thèse → driver → portefeuille → macro", blocking: false}
  ACT-016: {do: "Revue du corpus de doctrines (biais du survivant)", blocking: false}

# ---------------------------------------------------------------------------
# ARÊTES — objets auditables (justification + revue obligatoires)
# ---------------------------------------------------------------------------
edges:
  - {from: H12, to: exposure.factor_cap_ratchet, relation: requires, review: annual,
     justification: "le cliquet ne descend QUE par dilution ; sans apports il est mécaniquement impossible"}
  - {from: H12, to: H3, relation: supports, review: annual,
     justification: "des apports réguliers absorbent les besoins de cash et évitent la vente forcée"}
  - {from: H12, to: H1, relation: modulates, review: annual,
     justification: "sans dilution la concentration persiste, donc la corrélation mord davantage"}
  - {from: H3, to: H13, relation: modulates, review: annual,
     justification: "un horizon non garanti change les distributions long terme du solveur"}
  - {from: H1, to: H13, relation: modulates, review: annual,
     justification: "d_corrélation est une ENTRÉE du solveur : fausse corrélation → fausse taille"}
  - {from: H8, to: ledger_integrity, relation: requires, review: quarterly,
     justification: "sans écrivain unique, l'intégrité du ledger est logiquement impossible"}
  - {from: H8, to: H15, relation: requires, review: quarterly,
     justification: "un track record écrit au mauvais nœud ne peut rien enseigner"}
  - {from: H9, to: H8, relation: supports, review: quarterly,
     justification: "sans backup vérifié ni restauration testée, une erreur d'écriture est irréversible"}
  - {from: H7, to: H6, relation: supports, review: quarterly,
     justification: "sans origine tracée, l'écho est compté comme convergence"}
  - {from: H5, to: H5b, relation: requires, review: quarterly,
     justification: "l'ajustement des corporate actions dépend de la source de prix elle-même"}
  - {from: H5, to: H14, relation: modulates, review: quarterly,
     justification: "des niveaux calculés sur de faux prix déclenchent ou masquent des triggers"}
  - {from: H5b, to: H14, relation: modulates, review: quarterly,
     justification: "un prix non ajusté d'un split fausse le franchissement d'un decision-trigger"}
  - {from: H4, to: H14, relation: supports, review: annual,
     justification: "des triggers chiffrés sur des comptes faux ne déclenchent jamais"}
  - {from: H6, to: H14, relation: supports, review: quarterly,
     justification: "un trigger évalué sur un fait mal daté est faux"}
  - {from: H10, to: H11, relation: modulates, review: quarterly,
     justification: "moins de disponibilité = moins de capacité à appliquer la doctrine"}
  - {from: H11, to: H14, relation: modulates, review: quarterly,
     justification: "des triggers non relus ne sont pas surveillés"}
  - {from: H10, to: execution, relation: requires, review: quarterly,
     justification: "aucun autre opérateur ne sait exécuter le système aujourd'hui"}
  - {from: H2, to: H3, relation: supports, review: annual,
     justification: "l'illiquidité force des ventes à mauvais prix, donc érode la capacité à tenir"}
  - {from: H9c, to: H9b, relation: requires, review: quarterly,
     justification: "sans identifiants d'accès récupérables hors-Mac, la restauration depuis
                     l'offsite est IMPOSSIBLE dans le scénario même que H9b prétend couvrir —
                     le drill du 01/08 a emprunté la clé ssh du Mac, que la panne supprime"}
  - {from: H13, to: allocation_solver, relation: modulates, review: annual,
     justification: "la fraction de Kelly dépend de la qualité de l'estimation de p"}
  - {from: H1, to: H2, relation: correlated, review: annual,
     justification: "crises de corrélation et de liquidité coïncident souvent (aucun lien logique)"}

  # --- Arêtes ajoutées le 01/08 après la vue d'audit « asymétrie entrée/sortie ».
  # Les raccourcis `modules: [ALL]` masquaient les sorties de H10, H11, H14, H3, H13.
  # Croissance CONNECTIVE (autorisée par H11) : aucun concept neuf, uniquement des
  # liens entre objets existants, chacun justifié causalement.
  - {from: H14, to: decision_cycle.Q1, relation: requires, review: quarterly,
     justification: "Q1 juge l'intégrité d'une thèse UNIQUEMENT via ses triggers pré-enregistrés ;
                     si ces triggers ne capturent pas les modes de rupture, Q1 ne détecte
                     structurellement rien — le cycle devient un rituel vide"}
  - {from: H14, to: monitors, relation: requires, review: quarterly,
     justification: "les monitors évaluent des triggers : des triggers aveugles rendent
                     les monitors incapables de signaler, quelle que soit leur qualité d'exécution"}
  - {from: H14, to: H3, relation: supports, review: quarterly,
     justification: "des ruptures non détectées érodent la capacité à tenir : on subit
                     le drawdown au lieu de décider"}
  - {from: H10, to: revue_trimestrielle, relation: requires, review: quarterly,
     justification: "la revue est un acte humain ; sans opérateur disponible elle n'a pas lieu"}
  - {from: H10, to: override_mechanism, relation: requires, review: quarterly,
     justification: "un override est une décision humaine écrite : sans décideur, le
                     mécanisme n'existe pas — le système perd sa soupape"}
  - {from: H10, to: H15, relation: supports, review: quarterly,
     justification: "sans opérateur, aucune leçon n'est écrite ni relue : le transfert
                     de connaissance s'interrompt"}
  - {from: H11, to: doctrine_application, relation: requires, review: quarterly,
     justification: "une doctrine dont le coût d'attention dépasse la capacité n'est pas
                     appliquée — elle existe sur le papier, pas dans les décisions"}
  - {from: H11, to: H15, relation: modulates, review: quarterly,
     justification: "une doctrine non relue ne transmet rien : le volume dégrade la
                     qualité du transfert sans le rendre impossible"}
  - {from: H3, to: horizon_long, relation: requires, review: annual,
     justification: "l'horizon long n'est pas une préférence mais une CAPACITÉ :
                     sans elle, la durée de détention devient subie"}
  - {from: H3, to: theses_pluriannuelles, relation: requires, review: annual,
     justification: "une thèse à 3-5 ans est logiquement intenable si la position peut
                     être liquidée par un besoin externe"}
  - {from: H13, to: calibration, relation: requires, review: annual,
     justification: "sans probabilités estimables, il n'y a rien à calibrer :
                     le Brier n'a pas d'objet"}
