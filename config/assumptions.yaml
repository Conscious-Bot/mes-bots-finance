      note: >
        Seul actif du système à perte DÉFINITIVE en cas de panne disque : la DB existe
        en double (VM source + réplique Mac), le vault non. 261 Ko — d'où la priorité
        absolue donnée à sa mise à l'abri avant l'automatisation de la DB.
        H9b ne tient PAS sur « checksum bilatéral » (qui prouve un transfert, pas une
        restauration) mais sur une RESTAURATION DEPUIS L'OFFSITE, substance vérifiée —
        l'exposition qui reproduit son propre mode de défaillance.
        ⚠ DEMI-VIE : exposition CRITICAL périmée à 90 j → re-drill requis avant
        le 30/10/2026, sinon retour au statut « tenue par absence de contradiction ».
