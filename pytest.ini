[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    slow: network-dependent or LLM-call tests (skip default, run pre-release)
    live_data: tests qui lisent storage.DB_PATH (data/bot.db) -- gitignored, absent en CI.
        Marker ajoute 06/06 quand on a realise que CI etait rouge depuis toujours pour
        cette raison (sqlite3.OperationalError: no such table). Depuis 04/07 la CI
        les REJOUE contre une DB fixture (scripts/ci_fixture_db.py + PRESAGE_DB_PATH),
        sauf ceux marques live_book. Local : `pytest -m live_data`.
    live_book: sous-ensemble de live_data qui ASSERTE l'etat du VRAI book (tickers
        tenus, invariants du portefeuille reel). Ne tourne pas sur fixture
        synthetique -- local-only, exclu du job fixture CI.
