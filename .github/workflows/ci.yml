name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # allow manual trigger

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          allow-prereleases: true
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Ruff lint check
        run: ruff check . --output-format=github
      
      - name: Mypy type check (strict-typed modules)
        run: |
          mypy shared/math_helpers.py shared/storage.py shared/llm.py shared/edgar.py shared/prices.py shared/notify.py shared/config.py \
               shared/crypto.py shared/echo.py shared/embeddings.py shared/macro.py shared/data_source_base.py \
               data_sources/gmail_.py \
               intelligence/learning.py intelligence/materiality_v2.py intelligence/asymmetry.py intelligence/digest.py \
               intelligence/journal.py intelligence/credibility.py intelligence/bias_tagger.py intelligence/signal_classify.py \
               intelligence/materiality_boost.py intelligence/half_life.py intelligence/regime.py \
               intelligence/calendar.py intelligence/analyze.py intelligence/thesis.py \
               risk/risk_engine.py risk/sizing.py \
               --follow-imports=silent
      - name: Run pytest with coverage (skip slow + live_data)
        # marker `slow` exclu : tests reseau (SEC EDGAR) + Claude API.
        # marker `live_data` exclu ICI : rejoue a l'etape suivante contre la
        #   DB fixture (scripts/ci_fixture_db.py). Cf pytest.ini markers.
        run: |
          pytest tests/ -v --tb=short -m "not slow and not live_data" \
            --cov=shared.math_helpers \
            --cov=intelligence.materiality_v2 \
            --cov=intelligence.asymmetry \
            --cov=intelligence.learning \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Run live_data tests against fixture DB
        # Chantier #11 (04/07) : la classe live_data ne tournait JAMAIS en CI
        # ("rouge depuis toujours" -> skippee 06/06 au lieu d'etre couverte).
        # Fixture = schema reel (alembic head) + golden book synthetique.
        # live_book (asserte le VRAI book) reste local-only par construction.
        env:
          PRESAGE_DB_PATH: ${{ runner.temp }}/presage_fixture/bot.db
          PRESAGE_STATE_PATH: ${{ runner.temp }}/presage_fixture/bot_state.json
        run: |
          # Garde anti-fantôme (29/07) : le step unit peut créer data/bot.db par
          # effet de bord (connect sur chemin défaut = sqlite crée le fichier).
          # Cette DB partielle faisait échouer les tests à chemin en dur avec
          # « no such column » (verts en local contre la prod Mac, rouges ici).
          # Les chemins tests sont maintenant storage.DB_PATH ; on purge ET on
          # rend le fantôme VISIBLE pour traquer son créateur.
          if [ -f data/bot.db ]; then
            echo "::warning::data/bot.db FANTÔME créée pendant le step unit (side-effect à traquer) — purgée"
            rm -f data/bot.db data/bot.db-wal data/bot.db-shm
          fi
          python scripts/ci_fixture_db.py
          pytest tests/ -v --tb=short -m "live_data and not live_book and not slow"
      
      - name: Upload coverage to artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14
